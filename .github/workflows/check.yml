# 自动检查 —— 项目 5 · 自动化
#
# 这个文件放在仓库里，GitHub 就会在"有人往 main 推代码"时，
# 自己开一台机器、把代码取下来、按下面写的步骤跑一遍。
#
# 你不用在自己电脑上做任何事，也不用开着电脑 —— 它跑在 GitHub 那边。
#
# 想改它？改完 commit + push 就会生效。它就是仓库的一部分。

name: 自动检查

# ── 什么时候跑 ─────────────────────────────────────────────
on:
  push:
    branches: [main]      # 每次往 main 推代码就跑
  workflow_dispatch:      # 也允许你手动点一下就跑（Actions 页面右上角 Run workflow）

# ── 跑什么 ────────────────────────────────────────────────
jobs:
  check:
    # 借一台 GitHub 的机器（每次都是全新的、用完整台扔掉）
    runs-on: ubuntu-latest

    steps:
      # ⚠️ 这两个 @v5 不能改回 @v4：
      #    v4 内部声明自己跑在 Node 20 上，而 GitHub 已弃用 Node 20，
      #    会强制用 Node 24 跑并给你一条黄字警告（不影响功能，但脏）。
      #    v5 是这两个 action 为 Node 24 迁移发布的第一个版本。
      #    ★ 注意区分两种"Node 版本"：
      #       · 这里的 @v5        → 管"这个现成步骤自己用什么 Node 跑"（我们改不了，只能升版本）
      #       · 下面的 node-version → 管"给我们的项目装哪个 Node"（我们自己说了算）
      - name: ① 把代码取下来
        uses: actions/checkout@v5

      - name: ② 装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'      # 给项目装的 Node（本地也是 22）

      - name: ③ 报一下家底（跑在哪、什么版本）
        run: |
          echo "跑在哪台机器上：$RUNNER_OS"
          echo "仓库：$GITHUB_REPOSITORY"
          echo "是谁推的：$GITHUB_ACTOR"
          echo "哪次提交：$GITHUB_SHA"
          node --version

      - name: ④ 语法检查（JS 写得对不对）
        run: node --check script.js

      # ⭐ 第 2 版的核心：这才是"自动化"真正的价值
      #    以前这些检查靠人记着做，现在机器每次自动做。
      #    任何一项没过 → 这一步失败 → 整条流水线给红叉。
      - name: ⑤ 自检（id 对账 / 契约 / 权限判据 / 密钥扫描）
        run: node scripts/check.mjs

      - name: ⑥ 收工
        run: echo "✅ 检查全部通过"
