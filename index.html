<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>留言板 · 第 4 步 · 只能删自己的</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!--
  留言板 —— 第 4 步：只能删自己的

  第 1 步做的是"读"：网页去云端把留言取回来。
  第 2 步做的是"证明你是谁"：注册 / 登录 / 退出。
  第 3 步做的是"写"：把留言送进云端。
  这一版做的是"删"—— 而重点不在删，在"权限"。

  为什么这一版特意把「删除」按钮放在**每一条**留言上，
  而不是只放在自己那条上？

    因为"这条归不归我"这件事，前端说了不算。
    云端数据库有一道门（RLS：行级安全），它会按"现在登录的是谁"
    自动过滤 —— 不归你的行，它一行都不会动，而且**不报错**。

    所以这一版是一次可以亲手做的实验：
    点别人那条「删除」→ 你会发现页面提示"一行都没删掉"，
    但 Console 里没有任何报错。这就是最值得记住的那种失败：
    沉默的失败。

    前端把按钮藏起来只是"好看"，它挡不住任何人 ——
    改一行代码就绕过去了。真正拦人的是数据库那道门。
-->
<main class="wrap">

  <header class="head">
    <div class="head-row">
      <h1>留言板</h1>
      <div class="account">
        <span class="who" id="who">检查登录状态…</span>
        <button id="openAuth" type="button">登录 / 注册</button>
        <button id="signOut" type="button" class="ghost" hidden>退出</button>
      </div>
    </div>
    <p class="sub">第 4 步 · 只能删自己的（按钮谁都能点，但不是你的就删不掉）</p>
  </header>

  <p class="origin" id="origin"></p>

  <!-- ───────────── 登录面板 ─────────────
       平时收起来，点右上角「登录 / 注册」才展开。
       三种登录方式各占一个标签页，外加一个「重置密码」。
       注意：这三种方式都必须先有邮箱验证码 —— 这是云端定的规矩。 -->
  <section class="auth" id="authPanel" hidden>

    <div class="tabs" id="tabs">
      <button class="tab is-on" type="button" data-tab="password">密码登录</button>
      <button class="tab" type="button" data-tab="otp">验证码登录</button>
      <button class="tab" type="button" data-tab="signup">注册</button>
    </div>

    <!-- ① 邮箱 + 密码 -->
    <div class="pane" data-pane="password">
      <label class="field"><span>邮箱</span>
        <input id="pw-email" type="email" autocomplete="username" placeholder="you@example.com" /></label>
      <label class="field"><span>密码</span>
        <input id="pw-password" type="password" autocomplete="current-password" /></label>
      <div class="row">
        <button id="pw-submit" type="button">登录</button>
        <button class="link" id="pw-forgot" type="button">忘记密码？</button>
      </div>
    </div>

    <!-- ② 邮箱 + 验证码（不用记密码） -->
    <div class="pane" data-pane="otp" hidden>
      <label class="field"><span>邮箱</span>
        <input id="otp-email" type="email" autocomplete="username" placeholder="you@example.com" /></label>
      <div class="row">
        <button id="otp-send" type="button">发送验证码</button>
      </div>
      <div id="otp-step2" hidden>
        <label class="field"><span>邮箱里收到的验证码</span>
          <input id="otp-token" inputmode="numeric" autocomplete="one-time-code" /></label>
        <div class="row"><button id="otp-submit" type="button">登录</button></div>
      </div>
    </div>

    <!-- ③ 注册：先验证邮箱，再设密码 -->
    <div class="pane" data-pane="signup" hidden>
      <p class="note">注册要先证明这个邮箱是你的：点「发送验证码」，去邮箱把码填回来，再设一个密码。</p>
      <label class="field"><span>邮箱</span>
        <input id="su-email" type="email" autocomplete="username" placeholder="you@example.com" /></label>
      <div class="row">
        <button id="su-send" type="button">发送验证码</button>
      </div>
      <div id="su-step2" hidden>
        <label class="field"><span>邮箱里收到的验证码</span>
          <input id="su-token" inputmode="numeric" autocomplete="one-time-code" /></label>
        <label class="field"><span>设置一个密码</span>
          <input id="su-password" type="password" autocomplete="new-password" /></label>
        <div class="row"><button id="su-submit" type="button">创建账号</button></div>
      </div>
    </div>

    <!-- ④ 重置密码（从密码登录页的「忘记密码？」进来） -->
    <div class="pane" data-pane="reset" hidden>
      <p class="note">忘记密码：先证明邮箱是你的，再设一个新密码。</p>
      <label class="field"><span>邮箱</span>
        <input id="rs-email" type="email" autocomplete="username" placeholder="you@example.com" /></label>
      <div class="row">
        <button id="rs-send" type="button">发送验证码</button>
        <button class="link" id="rs-back" type="button">返回登录</button>
      </div>
      <div id="rs-step2" hidden>
        <label class="field"><span>邮箱里收到的验证码</span>
          <input id="rs-token" inputmode="numeric" autocomplete="one-time-code" /></label>
        <label class="field"><span>新密码</span>
          <input id="rs-password" type="password" autocomplete="new-password" /></label>
        <div class="row"><button id="rs-submit" type="button">重设密码并登录</button></div>
      </div>
    </div>

    <p class="auth-msg" id="authMsg"></p>
  </section>

  <!-- ───────────── 发留言（第 3 步新增） ─────────────
       这一块是"写"。
       注意它和上面登录面板的区别：登录面板是"证明你是谁"，
       这一块是"以你的身份办一件事"。

       发出去之后会重新去云端读一遍列表 ——
       因为"写进去"只是我们这边以为成功了，
       "从云端读回来"才是真的成功。 -->
  <section class="compose">
    <p class="compose-hint" id="cp-hint"></p>

    <label class="field"><span>昵称（只在留言上显示，不参与权限判断）</span>
      <input id="cp-name" maxlength="20" placeholder="不填就用邮箱前缀" /></label>

    <label class="field"><span>留言内容</span>
      <textarea id="cp-text" rows="3" maxlength="500" placeholder="说点什么…"></textarea></label>

    <div class="row">
      <button id="cp-submit" type="button">发表</button>
      <span class="counter" id="cp-count">0 / 500</span>
    </div>

    <p class="compose-msg" id="cp-msg"></p>
  </section>

  <section class="panel">
    <div class="bar">
      <button id="reload" type="button">重新读一次</button>
      <span class="status" id="status">准备中…</span>
    </div>

    <!-- ───────────── 留言列表（第 4 步：每条下面多了「删除」） ─────────────
         删除按钮是 JS 在画列表时现做出来的，所以这里看不到它的 HTML。
         二次确认也不用浏览器自带的 confirm() 弹窗 ——
         那种弹窗在某些嵌入环境下会被直接挡掉，表现就是"点了没反应"，
         正是我们上一次踩过的坑。改成按钮自己变一次字：先点变「真的删？」，再点才删。 -->
    <ul class="list" id="list"></ul>
  </section>

  <footer class="foot">
    <p>这一版能删了，而且只能删自己的 —— 但拦住你的是云端那道门，不是这个页面。</p>
  </footer>

</main>

<script src="cloud-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="script.js"></script>
</body>
</html>
